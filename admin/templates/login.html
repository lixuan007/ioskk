<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - {{ app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <h1>{{ app_name }}</h1>
      <div id="flashBox">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for cat, msg in messages %}
            <div class="flash {{ cat }}">{{ msg }}</div>
          {% endfor %}
        {% endwith %}
      </div>
      <form method="post" id="loginForm">
        <div class="field">
          <label>账号</label>
          <input type="text" name="name" id="name" value="{{ name or '' }}" autocomplete="username" required>
        </div>
        <div class="field">
          <label>密码</label>
          <input type="password" name="password" id="password" autocomplete="current-password" required>
        </div>
        <div class="field">
          <label>验证码</label>
          <div class="code-row">
            <input type="text" name="code" id="code" placeholder="Telegram 验证码" autocomplete="one-time-code">
            <button class="btn btn-ghost" type="button" id="sendCodeBtn">发送验证码</button>
          </div>
        </div>
        <button class="btn btn-block" type="submit" name="action" value="login">登录</button>
      </form>
    </div>
  </div>
  <script>
    (function () {
      var btn = document.getElementById("sendCodeBtn");
      var flashBox = document.getElementById("flashBox");
      var cooldown = 0;
      var timer = null;

      function showFlash(msg, cat) {
        flashBox.innerHTML = '<div class="flash ' + cat + '">' + msg + "</div>";
      }

      function setCooldown(sec) {
        cooldown = sec;
        btn.disabled = true;
        btn.textContent = sec + "s";
        clearInterval(timer);
        timer = setInterval(function () {
          cooldown -= 1;
          if (cooldown <= 0) {
            clearInterval(timer);
            btn.disabled = false;
            btn.textContent = "发送验证码";
          } else {
            btn.textContent = cooldown + "s";
          }
        }, 1000);
      }

      btn.addEventListener("click", function () {
        if (cooldown > 0) return;
        var name = document.getElementById("name").value.trim();
        var password = document.getElementById("password").value;
        if (!name || !password) {
          showFlash("请输入账号和密码", "error");
          return;
        }
        btn.disabled = true;
        btn.textContent = "发送中...";
        var body = new URLSearchParams();
        body.set("action", "send_code");
        body.set("name", name);
        body.set("password", password);
        fetch("/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-Requested-With": "XMLHttpRequest",
            "Accept": "application/json",
          },
          body: body.toString(),
        })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            showFlash(data.msg || (data.ok ? "已发送" : "发送失败"), data.ok ? "ok" : "error");
            if (data.ok) setCooldown(60);
            else {
              btn.disabled = false;
              btn.textContent = "发送验证码";
            }
          })
          .catch(function () {
            showFlash("网络错误，请重试", "error");
            btn.disabled = false;
            btn.textContent = "发送验证码";
          });
      });
    })();
  </script>
</body>
</html>
